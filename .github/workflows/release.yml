name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
          
    steps:
    - name: Check code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25.x
        check-latest: true

    - name: Set up build variables
      id: vars
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        echo "tag=${TAG}" >> $GITHUB_OUTPUT

    - name: Build binary
      run: |
        pwd
        mkdir -p dist
        ls -la .
        cd flowmq
        pwd
        version="${{ steps.vars.outputs.tag }}"
        version="${version#v}"
        go_flags="-s -w -X 'main.Version=${version}'"
        CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="${go_flags}" -a -o ../dist/bento-${version}-${{ matrix.goos }}-${{ matrix.goarch }} ./main.go
        ls -la .
        cd ..
        pwd
        ls -la dist/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bento-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/bento-${version}-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Gather release assets
        id: gather
        run: |
          pwd
          ls -la .
          files=$(find dist -type f)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
          files: ${{ steps.gather.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}



