input:
  generate:
    count: 5
    interval: 1s
    mapping: |
      root = {
        "device": "sensor",
        "timestamp": now(),
        "temperature": random_int(timestamp_unix_nano(), 0, 40),
        "humidity": random_int(timestamp_unix_nano(), 0, 100)
      }

pipeline:
  processors:
    - mapping: |
        root = this

output:
